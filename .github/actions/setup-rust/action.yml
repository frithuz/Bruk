name: Set up Rust and sccache
description: Install the pinned Rust toolchain, cache Cargo registry crates, and configure pnpr sccache WebDAV caching and optional cargo-nextest.

inputs:
  pnpr-token:
    description: Token for registry.frithuz.dev sccache WebDAV access. Leave empty to skip remote sccache (e.g. fork PRs).
    required: false
    default: ""
  sccache-rw-mode:
    description: WebDAV access mode for sccache (READ_ONLY or READ_WRITE).
    required: false
    default: "READ_ONLY"
  enable-sccache:
    description: Whether to install and configure sccache when pnpr-token is set.
    required: false
    default: "true"
  enable-registry-cache:
    description: Whether to cache ~/.cargo/registry/cache and index keyed on Cargo.lock.
    required: false
    default: "true"
  install-nextest:
    description: Whether to install pinned cargo-nextest for parallel test execution.
    required: false
    default: "false"
  compiler-cache-url:
    description: pnpr sccache WebDAV endpoint URL.
    required: false
    default: "https://registry.frithuz.dev/-/pnpr/v0/compiler-cache/frithuz"

runs:
  using: composite
  steps:
    - name: Set up pinned Rust toolchain
      shell: bash
      env:
        RUSTUP_AUTO_SELF_UPDATE: disable
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        # rustup reads rust-toolchain.toml in the workspace root and installs the
        # pinned channel and components automatically.
        rustup show active-toolchain
        rustc --version
        cargo --version

    - name: Cache Cargo registry (read-write)
      if: inputs.enable-registry-cache == 'true' && inputs.sccache-rw-mode == 'READ_WRITE'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
        key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

    - name: Restore Cargo registry (read-only)
      if: inputs.enable-registry-cache == 'true' && inputs.sccache-rw-mode != 'READ_WRITE'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
        key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

    - name: Install cargo-nextest
      if: inputs.install-nextest == 'true'
      shell: bash
      env:
        NEXTEST_VERSION: "0.9.152"
      run: |
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            target="universal-apple-darwin"
            sha256="2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76"
            ;;
          Linux-X64)
            target="x86_64-unknown-linux-musl"
            sha256="521c5f790ed07ee69d0a88403d9d86a8c8ab27977f12fc73f22aa4e7e14a0f71"
            ;;
          Linux-ARM64)
            target="aarch64-unknown-linux-musl"
            sha256="f168dbfe9c9c3a4b247cf10d9c260f3dac90a1373f5c4b1bfd3b0b8ac8d77095"
            ;;
          *)
            echo "error: unsupported runner platform ${RUNNER_OS}-${RUNNER_ARCH} for cargo-nextest" >&2
            exit 1
            ;;
        esac

        archive="${RUNNER_TEMP}/cargo-nextest.tar.gz"
        url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-${target}.tar.gz"

        curl -fsSL "$url" -o "$archive"
        if command -v sha256sum >/dev/null 2>&1; then
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
        else
          printf '%s  %s\n' "$sha256" "$archive" | shasum -a 256 -c -
        fi

        # Install into $HOME/.cargo/bin (already on PATH on GitHub macOS/Linux runners).
        mkdir -p "$HOME/.cargo/bin"
        tar -xzf "$archive" -C "$HOME/.cargo/bin" cargo-nextest
        rm -f "$archive"
        chmod +x "$HOME/.cargo/bin/cargo-nextest"
        "$HOME/.cargo/bin/cargo-nextest" --version

    - name: Install and configure sccache
      shell: bash
      env:
        PNPR_TOKEN: ${{ inputs.pnpr-token }}
        ENABLE_SCCACHE: ${{ inputs.enable-sccache }}
        SCCACHE_RW_MODE: ${{ inputs.sccache-rw-mode }}
        COMPILER_CACHE_URL: ${{ inputs.compiler-cache-url }}
        SCCACHE_VERSION: "0.20.1"
      run: |
        if [ "$ENABLE_SCCACHE" != "true" ]; then
          echo "sccache disabled for this job."
          exit 0
        fi

        token="$(printf '%s' "${PNPR_TOKEN:-}" | tr -d '\r\n')"
        if [ -z "$token" ]; then
          echo "No pnpr token provided (e.g. fork PR); building without remote sccache."
          exit 0
        fi

        case "$SCCACHE_RW_MODE" in
          READ_ONLY|READ_WRITE) ;;
          *)
            echo "error: sccache-rw-mode '${SCCACHE_RW_MODE}' must be READ_ONLY or READ_WRITE" >&2
            exit 1
            ;;
        esac

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          macOS-ARM64)
            target="aarch64-apple-darwin"
            sha256="d2658c9a24bab25a24fdc1917cb5b614b7c20a4ce8f363e5303d37b7e699d5ec"
            ;;
          Linux-X64)
            target="x86_64-unknown-linux-musl"
            sha256="c9f6c5a3ae84d9da0956b28c357a365827bda33f3383647fc0b67484c74a5ea9"
            ;;
          Linux-ARM64)
            target="aarch64-unknown-linux-musl"
            sha256="505324daad5fcbb1a3cab5d57d26ef42baf4d10b236df7de93a008196f1f2230"
            ;;
          *)
            echo "error: unsupported runner platform ${RUNNER_OS}-${RUNNER_ARCH} for sccache" >&2
            exit 1
            ;;
        esac

        archive="${RUNNER_TEMP}/sccache.tar.gz"
        asset_dir="sccache-v${SCCACHE_VERSION}-${target}"
        url="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${asset_dir}.tar.gz"

        curl -fsSL "$url" -o "$archive"
        if command -v sha256sum >/dev/null 2>&1; then
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
        else
          printf '%s  %s\n' "$sha256" "$archive" | shasum -a 256 -c -
        fi

        # Install into $HOME/.cargo/bin (already on PATH on GitHub macOS/Linux runners).
        mkdir -p "$HOME/.cargo/bin"
        tar -xzf "$archive" -C "$HOME/.cargo/bin" --strip-components=1 "${asset_dir}/sccache"
        rm -f "$archive"
        chmod +x "$HOME/.cargo/bin/sccache"

        "$HOME/.cargo/bin/sccache" --version

        {
          echo "RUSTC_WRAPPER=sccache"
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_WEBDAV_ENDPOINT=${COMPILER_CACHE_URL}"
          echo "SCCACHE_WEBDAV_TOKEN=${token}"
          echo "SCCACHE_WEBDAV_RW_MODE=${SCCACHE_RW_MODE}"
        } >> "$GITHUB_ENV"
        echo "Configured sccache (${SCCACHE_RW_MODE}) -> ${COMPILER_CACHE_URL}"
