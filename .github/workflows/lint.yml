name: Lint

on:
  pull_request:
  workflow_call:
    inputs:
      cache_write:
        description: Allow sccache to write to the pnpr WebDAV cache
        type: boolean
        required: false
        default: false

concurrency:
  group: lint-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check formatting
        id: rustfmt
        background: true
        env:
          RUSTUP_AUTO_SELF_UPDATE: disable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          rustup show active-toolchain
          cargo fmt --all -- --check

      - name: Lint commit trailers
        id: commit-trailers
        background: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            rev_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            rev_range="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            rev_range="${PUSH_SHA}"
          fi
          bash scripts/lint-commit-trailers.sh "$rev_range"

      - name: Audit workflows with zizmor
        id: zizmor
        background: true
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          persona: auditor
          strict-collection: true
          advanced-security: false
          annotations: true

      - name: Wait for OS-independent checks
        wait-all: true

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: ${{ github.event_name == 'workflow_call' && inputs.cache_write && 'CI Cache Write' || 'CI Cache Read' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and sccache
        uses: $/.github/actions/setup-rust
        with:
          pnpr-token: ${{ secrets.PNPR_TOKEN }}
          sccache-rw-mode: ${{ github.event_name == 'workflow_call' && inputs.cache_write && 'READ_WRITE' || 'READ_ONLY' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Show sccache stats
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  lint:
    name: Lint
    needs: [checks, clippy]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify lint jobs succeeded
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$CLIPPY_RESULT" != "success" ]; then
            echo "error: lint failed (checks=${CHECKS_RESULT}, clippy=${CLIPPY_RESULT})" >&2
            exit 1
          fi
