name: Lint

on:
  pull_request:
  workflow_call:
    inputs:
      cache_write:
        description: Allow sccache to write to the pnpr WebDAV cache
        type: boolean
        required: false
        default: false
    secrets:
      PNPR_TOKEN:
        description: pnpr token resolved from the target CI Cache environment
        required: false

concurrency:
  group: lint-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan Lint Scope
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_domain_clippy: ${{ steps.scope.outputs.run_domain_clippy }}
      run_macos_clippy: ${{ steps.scope.outputs.run_macos_clippy }}
      domain_clippy_args: ${{ steps.scope.outputs.domain_clippy_args }}
      macos_clippy_args: ${{ steps.scope.outputs.macos_clippy_args }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Determine affected crates
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/ci-affected-crates.py \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-affected-crates.py \
              --full \
              --github-output "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks (Linux)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache rustup toolchain (read-write)
        if: github.event_name != 'pull_request' && inputs.cache_write
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-fmt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Restore rustup toolchain (read-only)
        if: github.event_name == 'pull_request' || !inputs.cache_write
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
          key: rustup-fmt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Check formatting
        id: rustfmt
        background: true
        env:
          RUSTUP_AUTO_SELF_UPDATE: disable
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          rustup show active-toolchain
          cargo fmt --all -- --check

      - name: Lint commit trailers
        id: commit-trailers
        background: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            rev_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            rev_range="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            rev_range="${PUSH_SHA}"
          fi
          bash scripts/lint-commit-trailers.sh "$rev_range"

      - name: Audit workflows with zizmor
        id: zizmor
        background: true
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          persona: auditor
          strict-collection: true
          advanced-security: false
          annotations: true

      - name: Wait for OS-independent checks
        wait-all: true

  clippy-linux:
    name: Clippy Domain (ubuntu-latest)
    needs: [plan]
    if: needs.plan.outputs.run_domain_clippy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && inputs.cache_write && 'CI Cache Write' || 'CI Cache Read' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev

      - name: Set up Rust and sccache
        uses: $/.github/actions/setup-rust
        with:
          pnpr-token: ${{ secrets.PNPR_TOKEN }}
          sccache-rw-mode: ${{ github.event_name != 'pull_request' && inputs.cache_write && 'READ_WRITE' || 'READ_ONLY' }}

      - name: Run Clippy
        env:
          CARGO_ARGS: ${{ needs.plan.outputs.domain_clippy_args }}
        run: |
          read -r -a cargo_args <<< "$CARGO_ARGS"
          cargo clippy "${cargo_args[@]}" --all-targets --locked -- -D warnings

      - name: Show sccache stats
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  clippy-macos:
    name: Clippy (macos-26)
    needs: [plan]
    if: needs.plan.outputs.run_macos_clippy == 'true'
    runs-on: macos-26
    environment: ${{ github.event_name != 'pull_request' && inputs.cache_write && 'CI Cache Write' || 'CI Cache Read' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and sccache
        uses: $/.github/actions/setup-rust
        with:
          pnpr-token: ${{ secrets.PNPR_TOKEN }}
          sccache-rw-mode: ${{ github.event_name != 'pull_request' && inputs.cache_write && 'READ_WRITE' || 'READ_ONLY' }}

      - name: Run Clippy
        env:
          CARGO_ARGS: ${{ needs.plan.outputs.macos_clippy_args }}
        run: |
          read -r -a cargo_args <<< "$CARGO_ARGS"
          cargo clippy "${cargo_args[@]}" --all-targets --locked -- -D warnings

      - name: Show sccache stats
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  lint:
    name: Lint
    needs: [plan, checks, clippy-linux, clippy-macos]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify lint jobs succeeded
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          RUN_DOMAIN: ${{ needs.plan.outputs.run_domain_clippy }}
          RUN_MACOS: ${{ needs.plan.outputs.run_macos_clippy }}
          CLIPPY_LINUX_RESULT: ${{ needs.clippy-linux.result }}
          CLIPPY_MACOS_RESULT: ${{ needs.clippy-macos.result }}
        run: |
          failed=0
          if [ "$PLAN_RESULT" != "success" ] || [ "$CHECKS_RESULT" != "success" ]; then
            failed=1
          fi
          if [ "$RUN_DOMAIN" = "true" ] && [ "$CLIPPY_LINUX_RESULT" != "success" ]; then
            failed=1
          fi
          if [ "$RUN_MACOS" = "true" ] && [ "$CLIPPY_MACOS_RESULT" != "success" ]; then
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "error: lint failed (plan=${PLAN_RESULT}, checks=${CHECKS_RESULT}, clippy-linux=${CLIPPY_LINUX_RESULT}, clippy-macos=${CLIPPY_MACOS_RESULT})" >&2
            exit 1
          fi
