name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump to apply"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      changelog:
        description: "Release changelog text for the GitHub Release notes"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  verify-checks:
    name: Verify CI checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      run_lint: ${{ steps.checks.outputs.run_lint }}
      run_test: ${{ steps.checks.outputs.run_test }}
    steps:
      - name: Check existing Lint and Test results
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        run: |
          bump="$(printf '%s' "${INPUT_BUMP:-}" | tr -d '[:space:]')"
          case "$bump" in
            major|minor|patch) ;;
            *)
              echo "error: bump input '${INPUT_BUMP:-}' must be one of: patch, minor, major" >&2
              exit 1
              ;;
          esac

          trimmed_changelog="${INPUT_CHANGELOG:-}"
          trimmed_changelog="${trimmed_changelog#"${trimmed_changelog%%[![:space:]]*}"}"
          trimmed_changelog="${trimmed_changelog%"${trimmed_changelog##*[![:space:]]}"}"
          if [ -z "$trimmed_changelog" ]; then
            echo "error: changelog input must not be empty" >&2
            exit 1
          fi

          results="$(
            gh api --paginate --slurp \
              "repos/${GH_REPO}/commits/${TARGET_SHA}/check-runs?per_page=100" \
              --jq '
                [.[].check_runs[] | select(.app.slug == "github-actions" and .status == "completed" and .conclusion != "skipped")]
                | {
                    lint: ([.[] | select(.name == "Lint" or .name == "Lint / Lint")] | sort_by(.id) | last | .conclusion // ""),
                    test: ([.[] | select(.name == "Test" or .name == "Test / Test")] | sort_by(.id) | last | .conclusion // "")
                  }
                | "lint=\(.lint)\ntest=\(.test)"
              '
          )"

          lint_conclusion=""
          test_conclusion=""
          while IFS='=' read -r key val; do
            case "$key" in
              lint) lint_conclusion="$val" ;;
              test) test_conclusion="$val" ;;
            esac
          done <<< "$results"

          if [ "$lint_conclusion" = "success" ]; then
            echo "Lint already passed on ${TARGET_SHA}; skipping duplicate run."
            run_lint="false"
          else
            echo "Lint has not passed on ${TARGET_SHA} (latest: '${lint_conclusion:-none}'); will run Lint."
            run_lint="true"
          fi

          if [ "$test_conclusion" = "success" ]; then
            echo "Test already passed on ${TARGET_SHA}; skipping duplicate run."
            run_test="false"
          else
            echo "Test has not passed on ${TARGET_SHA} (latest: '${test_conclusion:-none}'); will run Test."
            run_test="true"
          fi

          {
            echo "run_lint=${run_lint}"
            echo "run_test=${run_test}"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: [verify-checks]
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && needs.verify-checks.result == 'success' && needs.verify-checks.outputs.run_lint == 'true')
      )
    permissions:
      contents: read
    uses: $/.github/workflows/lint.yml

  test:
    name: Test
    needs: [verify-checks]
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && needs.verify-checks.result == 'success' && needs.verify-checks.outputs.run_test == 'true')
      )
    permissions:
      contents: read
    uses: $/.github/workflows/test.yml

  check-release:
    name: Check release
    needs: [verify-checks, lint, test]
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.lint.result == 'success' && needs.test.result == 'success') ||
        (github.event_name == 'push' && github.ref_type == 'tag') ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs.verify-checks.result == 'success' &&
          (needs.verify-checks.outputs.run_lint == 'false' || needs.lint.result == 'success') &&
          (needs.verify-checks.outputs.run_test == 'false' || needs.test.result == 'success')
        )
      )
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      bump: ${{ steps.plan.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release eligibility
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "error: git tag '${REF_NAME}' must match vX.Y.Z (optional -prerelease)" >&2
              exit 1
            fi
            # Publishing with a scoped PAT (RELEASE_TOKEN) fires a push event for the
            # newly created v* tag. Skip rebuilding when the release already has assets.
            asset_count="$(gh release view "$REF_NAME" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
            if [ "$asset_count" -gt 0 ]; then
              echo "GitHub Release ${REF_NAME} already exists with ${asset_count} asset(s); skipping duplicate release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag ${REF_NAME} has no published release assets yet; proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bump="$(printf '%s' "${INPUT_BUMP:-}" | tr -d '[:space:]')"
            case "$bump" in
              major|minor|patch) ;;
              *)
                echo "error: bump input '${INPUT_BUMP:-}' must be one of: patch, minor, major" >&2
                exit 1
                ;;
            esac

            trimmed_changelog="${INPUT_CHANGELOG:-}"
            trimmed_changelog="${trimmed_changelog#"${trimmed_changelog%%[![:space:]]*}"}"
            trimmed_changelog="${trimmed_changelog%"${trimmed_changelog##*[![:space:]]}"}"
            if [ -z "$trimmed_changelog" ]; then
              echo "error: changelog input must not be empty" >&2
              exit 1
            fi

            release_tag="$(bash scripts/compute-next-tag.sh "$bump" HEAD)"
            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "error: git tag '${release_tag}' already exists" >&2
              exit 1
            fi

            echo "Manual release dispatch validated: bump=${bump}, next_tag=${release_tag}."
            {
              echo "should_release=true"
              echo "bump=${bump}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump="$(bash scripts/compute-release-bump.sh HEAD)"
          echo "Computed bump from Version-Bump trailers: ${bump}"
          if [ "$bump" = "none" ]; then
            echo "No commits with Version-Bump trailers since the last tag; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_release=true"
            echo "bump=${bump}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS (arm64)
    needs: [check-release]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: macos-26
    environment: Mac App Signing
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install git-cliff
        if: github.event_name != 'workflow_dispatch'
        env:
          GIT_CLIFF_VERSION: "2.14.2"
          GIT_CLIFF_SHA256: "a0be97e237d440d34c5e508ec21d070b2c85cbb8be48a46a56f9a4e8bd247f05"
        run: |
          archive="${RUNNER_TEMP}/git-cliff.tar.gz"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-aarch64-apple-darwin.tar.gz"
          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$GIT_CLIFF_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" --strip-components=1 "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          rm -f "$archive"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-cliff" --version

      - name: Resolve release version, changelog, and stamp manifests
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          PLANNED_BUMP: ${{ needs.check-release.outputs.bump }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          rm -f "$notes_file"

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "error: git tag '${release_tag}' must match vX.Y.Z (optional -prerelease)" >&2
              exit 1
            fi
            git-cliff --current --output "$notes_file"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bump="$(printf '%s' "${INPUT_BUMP:-${PLANNED_BUMP:-}}" | tr -d '[:space:]')"
            case "$bump" in
              major|minor|patch) ;;
              *)
                echo "error: bump input '${bump}' must be one of: patch, minor, major" >&2
                exit 1
                ;;
            esac

            trimmed_changelog="${INPUT_CHANGELOG:-}"
            trimmed_changelog="${trimmed_changelog//$'\r'/}"
            trimmed_changelog="${trimmed_changelog#"${trimmed_changelog%%[![:space:]]*}"}"
            trimmed_changelog="${trimmed_changelog%"${trimmed_changelog##*[![:space:]]}"}"
            if [ -z "$trimmed_changelog" ]; then
              echo "error: changelog input must not be empty" >&2
              exit 1
            fi

            release_tag="$(bash scripts/compute-next-tag.sh "$bump" HEAD)"
            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "error: git tag '${release_tag}' already exists" >&2
              exit 1
            fi

            printf '%s\n' "$trimmed_changelog" > "$notes_file"
          else
            bump="${PLANNED_BUMP:-$(bash scripts/compute-release-bump.sh HEAD)}"
            echo "Computed bump from Version-Bump trailers: ${bump}"
            if [ "$bump" = "none" ]; then
              echo "error: no commits with Version-Bump trailers since the last tag" >&2
              exit 1
            fi
            release_tag="$(git-cliff --bump "$bump" --bumped-version)"

            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "error: git tag '${release_tag}' already exists" >&2
              exit 1
            fi

            git-cliff --unreleased --tag "$release_tag" --output "$notes_file"
          fi

          release_version="${release_tag#v}"
          echo "Resolved release_tag=${release_tag} release_version=${release_version}"
          bash scripts/stamp-version.sh "$release_version"

          echo "=== Release Notes ==="
          if [ -s "$notes_file" ]; then
            cat "$notes_file"
          else
            echo "(empty; GitHub auto-generated notes will be used as fallback)"
          fi

          {
            echo "tag=${release_tag}"
            echo "version=${release_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure updater public key
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          public_key="$(printf '%s' "$UPDATER_PUBLIC_KEY" | tr -d '[:space:]')"
          has_secret=0
          if [ -n "$(printf '%s' "$UPDATER_SIGNING_KEY" | tr -d '[:space:]')" ]; then
            has_secret=1
          fi

          if [ -n "$public_key" ]; then
            if [ "$has_secret" -ne 1 ]; then
              echo "error: UPDATER_PUBLIC_KEY variable is set, so UPDATER_SIGNING_KEY secret is required" >&2
              exit 1
            fi
            jq --arg pk "$public_key" '.updater.publicKey = $pk' nsh.json > nsh.json.tmp
            mv nsh.json.tmp nsh.json
            echo "Injected updater.publicKey from UPDATER_PUBLIC_KEY environment variable"
          else
            existing_key="$(jq -r '.updater.publicKey // empty' nsh.json)"
            if [ -n "$existing_key" ] && [ "$has_secret" -ne 1 ]; then
              echo "error: nsh.json sets updater.publicKey, so UPDATER_SIGNING_KEY secret is required" >&2
              exit 1
            fi
            if [ -z "$existing_key" ] && [ "$has_secret" -eq 1 ]; then
              echo "error: UPDATER_SIGNING_KEY secret is set, so UPDATER_PUBLIC_KEY variable is required" >&2
              exit 1
            fi
            echo "No updater public key configured; release manifest will be published unsigned"
          fi

      - name: Install Native Shell CLI
        run: |
          nsh_version="$(awk -F'"' '$0 == "name = \"nsh-core\"" { found=1; next } found && /^version = "/ { print $2; exit }' Cargo.lock)"
          if [ -z "$nsh_version" ]; then
            echo "error: could not determine nsh-core version from Cargo.lock" >&2
            exit 1
          fi
          export NSH_VERSION="v${nsh_version}"
          echo "Installing Native Shell CLI ${NSH_VERSION}"
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          nsh --version

      - name: Package macOS app bundle
        run: |
          nsh package --target macos
          # Drop the pre-signing ad-hoc archive created by `nsh package`; we re-archive
          # Bruk.app below after applying Assets.car, Developer ID signing, and stapling.
          rm -f .nsh/out/*.tar.gz
          bash scripts/apply-macos-icon.sh ".nsh/out/Bruk.app" "assets/Bruk.icon"
          lipo -archs ".nsh/out/Bruk.app/Contents/MacOS/Bruk"

      - name: Sign macOS app bundle
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
        run: |
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          cert_path="${RUNNER_TEMP}/cert.p12"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_P12" | tr -d '\r\n' | base64 --decode > "$cert_path"
          chmod 600 "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security find-identity -v -p codesigning "$keychain_path"

          codesign --force --options runtime --timestamp \
            --entitlements assets/entitlements.plist \
            --sign "$SIGNING_IDENTITY" \
            --identifier dev.frithuz.bruk \
            --keychain "$keychain_path" \
            ".nsh/out/Bruk.app"

          codesign --verify --deep --strict --verbose=2 ".nsh/out/Bruk.app"
          codesign --display --verbose=2 --entitlements - ".nsh/out/Bruk.app"

      - name: Create and sign DMG
        env:
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          keychain_path="${RUNNER_TEMP}/signing.keychain-db"
          dmg_stage="${RUNNER_TEMP}/dmg-stage"
          dmg_rw="${RUNNER_TEMP}/Bruk-rw.dmg"
          dmg_mount="${RUNNER_TEMP}/dmg-mount"
          dmg="dist/Bruk-${RELEASE_TAG}-macos-arm64.dmg"

          rm -rf "$dmg_stage" "$dmg_mount" "$dmg_rw" "$dmg"
          mkdir -p "$dmg_stage" "$dmg_mount" dist
          ditto ".nsh/out/Bruk.app" "$dmg_stage/Bruk.app"
          ln -s /Applications "$dmg_stage/Applications"
          bash scripts/make-dmg-volume-icon.sh "assets/icon.png" "$dmg_stage/.VolumeIcon.icns"

          # Create a temporary read-write image to set the volume's custom-icon flag, then
          # convert to read-only UDZO UDIF so the DMG embeds a checksum verified on mount.
          hdiutil create \
            -volname "Bruk" \
            -srcfolder "$dmg_stage" \
            -ov \
            -format UDRW \
            "$dmg_rw"

          hdiutil attach "$dmg_rw" \
            -readwrite \
            -noverify \
            -noautoopen \
            -nobrowse \
            -mountpoint "$dmg_mount"

          xcrun SetFile -a C "$dmg_mount"
          xcrun SetFile -a V "$dmg_mount/.VolumeIcon.icns"

          detached=0
          for _ in 1 2 3 4 5; do
            if hdiutil detach "$dmg_mount"; then
              detached=1
              break
            fi
            sleep 2
          done
          if [ "$detached" -ne 1 ]; then
            hdiutil detach "$dmg_mount" -force
          fi

          hdiutil convert "$dmg_rw" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            -o "$dmg"

          codesign --force --timestamp \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$keychain_path" \
            "$dmg"

          codesign --verify --verbose=2 "$dmg"

      - name: Notarize, staple, and verify DMG
        env:
          API_KEY_P8: ${{ secrets.API_KEY_P8 }}
          API_KEY_ID: ${{ vars.API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.API_ISSUER_ID }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          api_key_path="${RUNNER_TEMP}/AuthKey.p8"
          result_json="${RUNNER_TEMP}/notary-result.json"
          dmg="dist/Bruk-${RELEASE_TAG}-macos-arm64.dmg"

          if printf '%s' "$API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$API_KEY_P8" > "$api_key_path"
          else
            printf '%s' "$API_KEY_P8" | tr -d '\r\n' | base64 --decode > "$api_key_path"
          fi
          chmod 600 "$api_key_path"

          set +e
          xcrun notarytool submit "$dmg" \
            --key "$api_key_path" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait \
            --output-format json > "$result_json"
          submit_exit=$?
          set -e

          cat "$result_json"
          submission_id="$(jq -r '.id // empty' "$result_json" 2>/dev/null || true)"
          submission_status="$(jq -r '.status // empty' "$result_json" 2>/dev/null || true)"

          if [ "$submit_exit" -ne 0 ] || [ "$submission_status" != "Accepted" ]; then
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --key "$api_key_path" \
                --key-id "$API_KEY_ID" \
                --issuer "$API_ISSUER_ID" || true
            fi
            exit 1
          fi

          xcrun stapler staple -v "$dmg"
          xcrun stapler validate -v "$dmg"
          codesign --verify --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          hdiutil imageinfo -checksum "$dmg"
          hdiutil verify -nocache "$dmg"

          (cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")

          # Notarizing the DMG also notarizes the Bruk.app bundle inside it. Staple and
          # verify Bruk.app, then archive it for Native Shell's auto-updater (`latest.json`).
          xcrun stapler staple -v ".nsh/out/Bruk.app"
          xcrun stapler validate -v ".nsh/out/Bruk.app"
          codesign --verify --deep --strict --verbose=2 ".nsh/out/Bruk.app"
          spctl --assess --type execute --verbose=4 ".nsh/out/Bruk.app"

          archive="dist/Bruk-${RELEASE_VERSION}-macos-aarch64.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C .nsh/out Bruk.app
          (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          ls -lh dist

      - name: Generate Native Shell update manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          archive="dist/Bruk-${RELEASE_VERSION}-macos-aarch64.tar.gz"
          manifest_args=("$archive" -o dist)
          public_key="$(jq -r '.updater.publicKey // empty' nsh.json)"
          if [ -n "$public_key" ]; then
            if [ -z "$UPDATER_SIGNING_KEY" ]; then
              echo "error: nsh.json sets updater.publicKey, so UPDATER_SIGNING_KEY secret is required" >&2
              exit 1
            fi
            key_path="${RUNNER_TEMP}/updater.secret"
            printf '%s\n' "$(printf '%s' "$UPDATER_SIGNING_KEY" | tr -d '[:space:]')" > "$key_path"
            chmod 600 "$key_path"
            manifest_args+=(--key "$key_path")
          fi
          nsh update-manifest "${manifest_args[@]}"
          cat dist/latest.json
          ls -lh dist

      - name: Clean up signing materials
        if: always()
        run: |
          hdiutil detach "${RUNNER_TEMP}/dmg-mount" -force 2>/dev/null || true
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true
          rm -rf \
            "${RUNNER_TEMP}/dmg-stage" \
            "${RUNNER_TEMP}/dmg-mount"
          rm -f \
            "${RUNNER_TEMP}/Bruk-rw.dmg" \
            "${RUNNER_TEMP}/cert.p12" \
            "${RUNNER_TEMP}/AuthKey.p8" \
            "${RUNNER_TEMP}/updater.secret" \
            "${RUNNER_TEMP}/notary-result.json"

      - name: Stage release payload
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          dmg="dist/Bruk-${RELEASE_TAG}-macos-arm64.dmg"
          archive="dist/Bruk-${RELEASE_VERSION}-macos-aarch64.tar.gz"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          rm -rf release-payload
          mkdir -p release-payload/assets
          cp \
            "$dmg" \
            "${dmg}.sha256" \
            "$archive" \
            "${archive}.sha256" \
            "dist/latest.json" \
            release-payload/assets/
          if [ -f "dist/latest.json.sig" ]; then
            cp "dist/latest.json.sig" release-payload/assets/
          fi
          if [ -s "$notes_file" ]; then
            cp "$notes_file" release-payload/release-notes.md
          fi
          ls -lh release-payload release-payload/assets
          COPYFILE_DISABLE=1 tar -cf release-payload.tar -C release-payload .
          ls -lh release-payload.tar

      - name: Upload release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release-payload.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-slim
    environment: GitHub Release
    timeout-minutes: 15
    permissions:
      actions: read # download release-payload.tar artifact from the build job
    steps:
      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-payload.tar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "error: RELEASE_TOKEN secret is not set in the 'GitHub Release' environment" >&2
            exit 1
          fi

          rm -rf release-payload
          mkdir -p release-payload
          tar -xf release-payload.tar -C release-payload

          dmg="release-payload/assets/Bruk-${RELEASE_TAG}-macos-arm64.dmg"
          archive="release-payload/assets/Bruk-${RELEASE_VERSION}-macos-aarch64.tar.gz"
          notes_file="release-payload/release-notes.md"
          assets=(
            "$dmg"
            "${dmg}.sha256"
            "$archive"
            "${archive}.sha256"
            "release-payload/assets/latest.json"
          )
          if [ -f "release-payload/assets/latest.json.sig" ]; then
            assets+=("release-payload/assets/latest.json.sig")
          fi

          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            if [ "$is_draft" = "true" ]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            args=(--title "$RELEASE_TAG" --target "$TARGET_SHA" --draft)
            if [ -s "$notes_file" ] && grep -q '[^[:space:]]' "$notes_file"; then
              args+=(--notes-file "$notes_file")
            else
              args+=(--generate-notes)
            fi
            if [[ "$RELEASE_TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            # Create as draft first so all assets are attached atomically before the
            # tag is created and the release becomes visible to the auto-updater.
            gh release create "$RELEASE_TAG" "${assets[@]}" "${args[@]}"
            gh release edit "$RELEASE_TAG" --draft=false
          fi
