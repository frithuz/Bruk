name: Test

on:
  pull_request:
  workflow_call:
    inputs:
      cache_write:
        description: Allow sccache to write to the pnpr WebDAV cache
        type: boolean
        required: false
        default: false

concurrency:
  group: test-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test-platform:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: ${{ github.event_name == 'workflow_call' && inputs.cache_write && 'CI Cache Write' || 'CI Cache Read' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust and sccache
        uses: $/.github/actions/setup-rust
        with:
          pnpr-token: ${{ secrets.PNPR_TOKEN }}
          sccache-rw-mode: ${{ github.event_name == 'workflow_call' && inputs.cache_write && 'READ_WRITE' || 'READ_ONLY' }}

      - name: Run automated tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Show sccache stats
        if: always() && env.RUSTC_WRAPPER == 'sccache'
        run: sccache --show-stats

  test:
    name: Test
    needs: [test-platform]
    if: always() && !cancelled()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify test jobs succeeded
        env:
          TEST_RESULT: ${{ needs.test-platform.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "error: tests failed (test-platform=${TEST_RESULT})" >&2
            exit 1
          fi
