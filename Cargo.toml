[workspace]
resolver = "3"
members = [
    "crates/factory-types",
    "crates/factory-flags",
    "crates/factory-machines",
    "crates/factory-github",
    "crates/factory-secrets",
    "crates/factory-providers",
    "crates/factory-config",
    "crates/factory-workflows",
    "crates/factory-chat",
    "crates/factory-runner",
    "crates/factory-storage",
    "crates/factory-logging",
    "crates/factory-updater",
    "crates/factory-fonts",
    "crates/factory-ui-kit",
    "crates/factory-store",
    "crates/factory-ui-common",
    "crates/factory-ui-preferences",
    "crates/factory-ui-workflows",
    "crates/factory-ui-chat",
    "crates/factory-ui-ops",
    "crates/factory-core",
    "crates/factory-app",
    "crates/factory-desktop",
]
default-members = ["crates/factory-desktop"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
factory-app = { path = "crates/factory-app" }
factory-chat = { path = "crates/factory-chat" }
factory-config = { path = "crates/factory-config" }
factory-core = { path = "crates/factory-core" }
factory-flags = { path = "crates/factory-flags" }
factory-fonts = { path = "crates/factory-fonts" }
factory-github = { path = "crates/factory-github" }
factory-logging = { path = "crates/factory-logging" }
factory-machines = { path = "crates/factory-machines" }
factory-providers = { path = "crates/factory-providers" }
factory-runner = { path = "crates/factory-runner" }
factory-secrets = { path = "crates/factory-secrets" }
factory-storage = { path = "crates/factory-storage" }
factory-store = { path = "crates/factory-store" }
factory-types = { path = "crates/factory-types" }
factory-ui-chat = { path = "crates/factory-ui-chat" }
factory-ui-common = { path = "crates/factory-ui-common" }
factory-ui-kit = { path = "crates/factory-ui-kit" }
factory-ui-ops = { path = "crates/factory-ui-ops" }
factory-ui-preferences = { path = "crates/factory-ui-preferences" }
factory-ui-workflows = { path = "crates/factory-ui-workflows" }
factory-updater = { path = "crates/factory-updater" }
factory-workflows = { path = "crates/factory-workflows" }
aho-corasick = "1.1"
base64 = "0.22"
cc = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
keyring-core = "1.1"
dbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
windows-native-keyring-store = "1.1"
nsh-core = "0.6.1"
nsh-base = "0.6.1"
nsh-engine = { version = "0.6.1", default-features = false }
nsh-testing = { version = "0.6.1", default-features = false }
nsh-updater = "0.6.1"
ureq = { version = "3.1", features = ["platform-verifier"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSFontPanel",
    "NSPanel",
    "NSResponder",
    "NSWindow",
    "objc2-core-foundation",
] }
nsh-platform-macos = { version = "0.6.1", default-features = false, features = [
    "shader",
    "editor",
    "emoji-picker",
    "highlight",
    "math",
    "plot",
    "rich-editor",
    "term",
    "websocket",
    "updater",
    "svg",
] }

# Omit DWARF debuginfo for third-party dependencies in dev/test builds to shrink
# sccache WebDAV payloads and speed up linking across workspace test binaries.
[profile.dev.package."*"]
debug = 0
