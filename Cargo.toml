[workspace]
resolver = "3"
members = [
    "crates/factory-core",
    "crates/factory-app",
]
default-members = ["crates/factory-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
factory-core = { path = "crates/factory-core" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
env_logger = "0.11"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
tempfile = "3"
thiserror = "2"
nsh-core = "0.6.1"
nsh-base = "0.6.1"
nsh-engine = { version = "0.6.1", default-features = false }
nsh-testing = { version = "0.6.1", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSFontPanel",
    "NSPanel",
    "NSResponder",
    "NSWindow",
    "objc2-core-foundation",
] }
nsh-platform-macos = { version = "0.6.1", default-features = false, features = [
    "shader",
    "editor",
    "emoji-picker",
    "highlight",
    "math",
    "plot",
    "rich-editor",
    "term",
    "websocket",
    "updater",
    "svg",
] }
