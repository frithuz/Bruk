[workspace]
resolver = "3"
members = [
    "crates/factory-logging",
    "crates/factory-updater",
    "crates/factory-core",
    "crates/factory-app",
    "crates/factory-desktop",
]
default-members = ["crates/factory-desktop"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
factory-app = { path = "crates/factory-app" }
factory-core = { path = "crates/factory-core" }
factory-logging = { path = "crates/factory-logging" }
factory-updater = { path = "crates/factory-updater" }
aho-corasick = "1.1"
base64 = "0.22"
cc = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.8"
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
keyring-core = "1.1"
dbus-secret-service-keyring-store = "1.0"
windows-native-keyring-store = "1.1"
nsh-core = "0.6.1"
nsh-base = "0.6.1"
nsh-engine = { version = "0.6.1", default-features = false }
nsh-testing = { version = "0.6.1", default-features = false }
nsh-updater = "0.6.1"
ureq = { version = "3.1", features = ["platform-verifier"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObject", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSFontPanel",
    "NSPanel",
    "NSResponder",
    "NSWindow",
    "objc2-core-foundation",
] }
nsh-platform-macos = { version = "0.6.1", default-features = false, features = [
    "shader",
    "editor",
    "emoji-picker",
    "highlight",
    "math",
    "plot",
    "rich-editor",
    "term",
    "websocket",
    "updater",
    "svg",
] }
