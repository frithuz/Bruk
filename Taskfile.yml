# https://taskfile.dev

version: '3'

vars:
  BRUK_LOCATOR: '{{.HOME}}/Library/Application Support/Bruk/location'
  NSH_VERSION: 'v0.6.1'
  NSH_BIN:
    sh: command -v nsh 2>/dev/null || echo "{{.HOME}}/.local/bin/nsh"

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  nsh:install:
    desc: Install or update the Native Shell (nsh) CLI
    cmds:
      - NSH_VERSION={{.NSH_VERSION}} curl -fsSL https://nsh.dev/install.sh | sh

  macos:setup-dev-cert:
    desc: Create a local macOS code-signing cert ("Bruk Local Dev") for stable Keychain access in dev builds
    cmds:
      - bash scripts/setup-dev-cert.sh

  run:
    desc: Run the native macOS app via Cargo (signed with local dev identity when available)
    aliases: [dev]
    cmds:
      - bash scripts/run-signed-dev.sh {{.CLI_ARGS}}

  run:nsh:
    desc: Run the macOS app with Native Shell CLI (auto-rebuilds on Rust changes)
    preconditions:
      - sh: '[ -x "{{.NSH_BIN}}" ]'
        msg: "nsh CLI not found. Run `task nsh:install` first."
    cmds:
      - '"{{.NSH_BIN}}" run --target macos {{.CLI_ARGS}}'

  build:
    desc: Build all workspace crates (debug)
    cmds:
      - cargo build --workspace {{.CLI_ARGS}}

  build:release:
    desc: Build all workspace crates (release)
    cmds:
      - cargo build --workspace --release {{.CLI_ARGS}}

  package:
    desc: Package a standalone macOS .app bundle (.nsh/out/Bruk.app)
    aliases: [package:macos]
    preconditions:
      - sh: '[ -x "{{.NSH_BIN}}" ]'
        msg: "nsh CLI not found. Run `task nsh:install` first."
    cmds:
      - '"{{.NSH_BIN}}" package --target macos {{.CLI_ARGS}}'
      - bash scripts/apply-macos-icon.sh ".nsh/out/Bruk.app" "assets/Bruk.icon"

  package:run:
    desc: Package and launch the standalone macOS .app bundle
    preconditions:
      - sh: '[ -x "{{.NSH_BIN}}" ]'
        msg: "nsh CLI not found. Run `task nsh:install` first."
    cmds:
      - '"{{.NSH_BIN}}" package --target macos {{.CLI_ARGS}}'
      - bash scripts/apply-macos-icon.sh ".nsh/out/Bruk.app" "assets/Bruk.icon"
      - open ".nsh/out/Bruk.app"

  package:universal:
    desc: Package a universal (arm64 + x86_64) macOS .app bundle
    preconditions:
      - sh: '[ -x "{{.NSH_BIN}}" ]'
        msg: "nsh CLI not found. Run `task nsh:install` first."
    cmds:
      - '"{{.NSH_BIN}}" package --target macos --arch universal {{.CLI_ARGS}}'
      - bash scripts/apply-macos-icon.sh ".nsh/out/Bruk.app" "assets/Bruk.icon"

  test:
    desc: Run all unit tests and headless Native Shell UI tests
    cmds:
      - cargo test --workspace {{.CLI_ARGS}}

  test:core:
    desc: Run non-UI domain and SQLite storage tests
    cmds:
      - >-
        cargo test
        -p factory-types
        -p factory-machines
        -p factory-github
        -p factory-secrets
        -p factory-providers
        -p factory-config
        -p factory-workflows
        -p factory-chat
        -p factory-runner
        -p factory-storage
        {{.CLI_ARGS}}

  test:ui:
    desc: Run factory-app headless Native Shell UI flow tests
    cmds:
      - cargo test -p factory-app --tests {{.CLI_ARGS}}

  check:
    desc: Type-check all workspace targets without linking
    cmds:
      - cargo check --workspace --all-targets

  fmt:
    desc: Format all Rust code with rustfmt
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check Rust formatting without modifying files
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run Clippy across all workspace targets (warnings as errors)
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:commits:
    desc: Validate Version-Bump and Changelog trailers on commits (default HEAD; pass a rev-range via `--`)
    cmds:
      - bash scripts/lint-commit-trailers.sh {{.CLI_ARGS}}

  release:preview:
    desc: Preview the next release version and git-cliff changelog from unreleased Version-Bump trailers
    preconditions:
      - sh: command -v git-cliff >/dev/null 2>&1
        msg: "git-cliff not found. Install it with `brew install git-cliff` or `cargo install git-cliff`."
    cmds:
      - |
        bump="$(bash scripts/compute-release-bump.sh HEAD)"
        echo "Next bump: ${bump}"
        if [ "$bump" = "none" ]; then
          echo "No commits with Version-Bump trailers since the last tag."
          exit 0
        fi
        next_tag="$(git-cliff --bump "$bump" --bumped-version)"
        echo "Next tag:  ${next_tag}"
        echo ""
        git-cliff --unreleased --tag "$next_tag"

  ci:
    desc: Run full verification pipeline (fmt:check, lint, test, build)
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:commits
      - task: test
      - task: build

  db:path:
    desc: Print the active Bruk folder database path
    silent: true
    cmds:
      - |
        if [ -n "${BRUK_HOME:-}" ]; then
          echo "$BRUK_HOME/bruk.db"
        elif [ -s "{{.BRUK_LOCATOR}}" ]; then
          echo "$(head -n 1 "{{.BRUK_LOCATOR}}")/bruk.db"
        else
          echo "{{.HOME}}/Bruk/bruk.db"
        fi

  clean:
    desc: Remove Cargo target and Native Shell .nsh build directories
    cmds:
      - cargo clean
      - rm -rf .nsh
