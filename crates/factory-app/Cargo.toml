[package]
name = "factory-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
# Build flags, forwarded to `factory-flags` (see that crate for what each one gates).
machines = ["factory-flags/machines"]
unreleased = ["factory-flags/unreleased"]

[dependencies]
factory-config.workspace = true
factory-flags.workspace = true
factory-fonts.workspace = true
factory-github.workspace = true
factory-logging.workspace = true
factory-storage.workspace = true
factory-store.workspace = true
factory-types.workspace = true
factory-ui-chat.workspace = true
factory-ui-kit.workspace = true
factory-ui-ops.workspace = true
factory-ui-preferences.workspace = true
factory-ui-workflows.workspace = true
factory-updater.workspace = true
factory-workflows.workspace = true
nsh-base.workspace = true
nsh-core.workspace = true

[dev-dependencies]
factory-core.workspace = true
factory-flags = { workspace = true, features = ["test-override"] }
nsh-engine.workspace = true
nsh-testing.workspace = true
serde_json.workspace = true
tempfile.workspace = true
