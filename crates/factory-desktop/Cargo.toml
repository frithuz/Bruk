[package]
name = "factory-desktop"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "factory-desktop"
path = "src/main.rs"
test = false

[features]
# Build flags, forwarded to `factory-flags` (see that crate for what each one gates).
machines = ["factory-app/machines"]
unreleased = ["factory-app/unreleased"]

[dependencies]
factory-app.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
