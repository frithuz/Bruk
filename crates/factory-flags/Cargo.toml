[package]
name = "factory-flags"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
# One Cargo feature per build flag. Flags are off unless a build asks for them, so a plain
# `cargo build` (and therefore every packaged release) ships without unreleased work.
machines = []
# Every flag that gates work not ready to ship; development builds turn this on.
unreleased = ["machines"]
# Lets a test binary force flags at run time. Only ever enabled from dev-dependencies.
test-override = []
